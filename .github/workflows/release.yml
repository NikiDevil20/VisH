name: Build VisH

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build VisH
        run: dotnet publish VisH/VisH.csproj -c Release -r win-x64 --self-contained true -o publish